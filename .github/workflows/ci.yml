name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  tester:
    name: Testing 
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14]
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS)}}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CGAL_VERSION: '6.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
            python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - if: matrix.os == 'ubuntu-latest'
        # ubuntu-latest is still 24.04, whose libcgal-dev is 5.6. Passing an
        # edge_is_constrained_map to the mesh-mesh PMP::clip does not compile
        # there: 5.6's put() for Boolean_property_map takes a non-const
        # reference and the corefinement internals pass it as const. Fixed in
        # CGAL 6, so fetch the headers (CGAL is header-only) rather than wait
        # for the runner image to catch up.
        run: |
          sudo apt-get install -y libgl1-mesa-dev libeigen3-dev libboost-dev libgmp-dev libmpfr-dev
          wget -q https://github.com/CGAL/cgal/releases/download/v${CGAL_VERSION}/CGAL-${CGAL_VERSION}.tar.xz
          tar -xf CGAL-${CGAL_VERSION}.tar.xz
          echo "CMAKE_ARGS=-DCGAL_DIR=$PWD/CGAL-${CGAL_VERSION}/lib/cmake/CGAL" >> $GITHUB_ENV
      - if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install cgal
      # Cache vcpkg on Windows
      - name: Restore vcpkg cache
        if: runner.os == 'Windows'
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      - name: Install vcpkg dependencies (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Env:VCPKG_ROOT = "C:/vcpkg"
          if (!(Test-Path $Env:VCPKG_ROOT)) {
              git clone https://github.com/microsoft/vcpkg $Env:VCPKG_ROOT
              & "$Env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          }
           # Only install if packages are missing
          if (!(Test-Path "$Env:VCPKG_ROOT/installed/x64-windows/cgal")) {
              & "$Env:VCPKG_ROOT/vcpkg.exe" install yasm-tool cgal
          }
          echo "VCPKG_ROOT=$Env:VCPKG_ROOT" >> $Env:GITHUB_ENV
          # now inject your extra CMake flags:
          $toolchain = "$Env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          echo "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=${toolchain} -DVCPKG_ROOT=${Env:VCPKG_ROOT}" >> $Env:GITHUB_ENV
          echo $CMAKE_ARGS
      - name: Pip install
        run: |
           pip install .[test]
      - name: Run tests
        run: |
           pytest 
      
